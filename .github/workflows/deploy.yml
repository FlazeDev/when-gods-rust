name: Deploy Jaspr Site via Git Branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter/Dart
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Jaspr CLI
        run: dart pub global activate jaspr_cli

      # Added working-directory to navigate into the subfolder
      - name: Build Static Assets
        working-directory: my_overclock_app 
        run: |
          dart pub get
          jaspr build --port 8085

      - name: Deploy to gh-pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: my_overclock_app/build/jaspr # Adjusted to point to the subfolder output
          branch: gh-pages
