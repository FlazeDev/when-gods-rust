name: Deploy Jaspr Site via Git Branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter/Dart
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Jaspr CLI
        run: dart pub global activate jaspr_cli

      - name: Build Static Assets
        working-directory: my_overclock_app 
        run: |
          dart pub get
          jaspr build --port 8085

      - name: Deploy to Main Branch Subfolder
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: my_overclock_app/build/jaspr # The built Jaspr folder
          branch: main # Pushing it straight back to the main branch
          target-folder: app # Puts the Jaspr site into a folder named "app"
